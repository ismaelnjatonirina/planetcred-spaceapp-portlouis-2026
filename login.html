<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to PlanetCred DI." />
    <title data-i18n-title="login.documentTitle">PlanetCred DI | Sign in</title>
    <script src="page-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-950 font-sans text-slate-100 antialiased">
    <header
      class="flex flex-wrap items-center gap-4 border-b border-slate-800 bg-slate-900 px-6 py-4"
    >
      <a href="login.html" class="flex items-center gap-3 font-bold text-white">
        <span class="rounded bg-emerald-600 px-2.5 py-1 text-sm">DI</span>
        <span
          >PlanetCred
          <span class="font-normal text-emerald-400" data-i18n="brand.tagline"
            >Earth Observation Intelligence</span
          ></span
        >
      </a>
    </header>
    <main
      class="mx-auto flex min-h-[calc(100vh-68px)] max-w-md items-center px-5 py-12"
    >
      <section
        class="w-full rounded-2xl border border-slate-800 bg-slate-900 p-7 shadow-2xl sm:p-9"
        aria-labelledby="login-heading"
      >
        <p
          class="text-xs font-semibold uppercase tracking-[.2em] text-emerald-400"
          data-i18n="login.kicker"
        >
          Authentication
        </p>
        <h1
          id="login-heading"
          class="mt-3 text-2xl font-bold text-white"
          data-i18n="login.heading"
        >
          Sign in to PlanetCred DI
        </h1>
        <p
          class="mt-2 text-sm leading-6 text-slate-400"
          data-i18n="login.description"
        >
          Enter your account credentials to open the Earth observation
          dashboard.
        </p>
        <form id="login-form" class="mt-7 space-y-5" novalidate>
          <div>
            <label
              for="username"
              class="mb-2 block text-sm font-medium text-slate-200"
              data-i18n="login.username"
              >Username</label
            >
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-white outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20"
            />
          </div>
          <div>
            <label
              for="password"
              class="mb-2 block text-sm font-medium text-slate-200"
              data-i18n="login.password"
              >Password</label
            >
            <div class="flex gap-2">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                class="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-white outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20"
              />
              <button
                id="password-toggle"
                type="button"
                class="rounded-lg border border-slate-700 px-3 text-xs font-medium text-slate-300 hover:bg-slate-800"
                data-i18n="login.showPassword"
              >
                Show
              </button>
            </div>
          </div>
          <div id="confirm-password-field" class="hidden">
            <label
              for="confirm-password"
              class="mb-2 block text-sm font-medium text-slate-200"
              data-i18n="login.confirmPassword"
              >Confirm password</label
            >
            <input
              id="confirm-password"
              name="confirm-password"
              type="password"
              autocomplete="new-password"
              class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-white outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20"
            />
          </div>
          <p
            id="login-message"
            class="hidden rounded-lg border border-red-900/70 bg-red-950/50 px-3 py-2 text-sm text-red-200"
            role="alert"
            aria-live="polite"
          ></p>
          <button
            id="login-submit"
            type="submit"
            class="w-full rounded-lg bg-emerald-600 px-4 py-3 text-sm font-bold text-white shadow transition hover:bg-emerald-500 disabled:cursor-wait disabled:opacity-60"
            data-i18n="login.submit"
          >
            Sign in
          </button>
        </form>
        <p class="mt-5 text-center text-sm text-slate-400">
          <span id="auth-mode-prompt" data-i18n="login.noAccount">No account?</span>
          <button
            id="auth-mode-toggle"
            type="button"
            class="ml-1 font-semibold text-emerald-400 hover:text-emerald-300"
            data-i18n="login.signUp"
          >
            Sign Up
          </button>
        </p>
      </section>
    </main>
    <script src="i18n.js"></script>
    <script src="login.js"></script>
  </body>
</html>
